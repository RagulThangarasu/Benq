services:
  - type: web
    name: benq-validator
    # Docker, not the native Python environment. The native env can only run
    # `pip install`, and this app needs system packages that pip cannot provide:
    # Tesseract with every language pack (to read lettering baked into figure
    # artwork) and Unicode fonts (to print that lettering back in the report).
    # Without them non-English manuals validate in a degraded mode. The
    # Dockerfile installs both and fails the build if either is missing.
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # 1 worker keeps the in-memory progress store shared; the threads in the
      # Dockerfile CMD let /progress polls be served while /validate runs a long
      # job in another thread.
      - key: VALIDATOR_MAX_PARALLEL
        value: "1"
