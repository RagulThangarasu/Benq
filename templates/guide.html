<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BenQ Guide — Content Validation</title>
    <style>
      :root {
        --bg:#f5f7fa; --panel:#fff; --muted:#6b7280; --text:#0b1220;
        --primary:#0ea5a4; --accent:#3b82f6; --border:rgba(11,18,23,0.12);
        --ok:#047857; --okbg:rgba(16,185,129,0.12);
        --bad:#b91c1c; --badbg:rgba(239,68,68,0.10);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        color:var(--text);
      }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--bg); }
      header { background:linear-gradient(90deg,#0b1220,#111827); color:#fff; padding:14px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
      header h1 { font-size:1.15rem; margin:0; }
      header .crumb { color:#9aa6b2; font-size:0.82rem; }
      header a { color:#7dd3fc; text-decoration:none; font-weight:600; margin-left:auto; }
      select { padding:9px 12px; border-radius:8px; border:1px solid var(--border); font-size:0.92rem; font-weight:600; min-width:280px; }
      .wrap { display:flex; height:calc(100vh - 56px); }
      .toc { width:340px; min-width:280px; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:10px 0; }
      .toc .empty { color:var(--muted); padding:18px; font-size:0.9rem; }
      .toc-item { display:flex; align-items:center; gap:8px; padding:7px 14px; cursor:pointer; font-size:0.9rem; border-left:3px solid transparent; }
      .toc-item:hover { background:#f0f8f9; }
      .toc-item.active { background:#e6f6f6; border-left-color:var(--primary); font-weight:700; }
      .toc-item .dot { width:8px; height:8px; border-radius:50%; flex:none; background:#cbd5e1; }
      .toc-item.s-pass .dot { background:var(--ok); }
      .toc-item.s-fail .dot { background:var(--bad); }
      .toc-item .pg { margin-left:auto; color:var(--muted); font-size:0.78rem; }
      .content { flex:1; overflow-y:auto; padding:24px 30px; }
      .placeholder { color:var(--muted); margin-top:40px; text-align:center; font-size:0.95rem; }
      .sec-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
      .sec-head h2 { margin:0; font-size:1.35rem; }
      .badge { padding:4px 12px; border-radius:999px; font-size:0.78rem; font-weight:800; }
      .badge.pass { background:var(--okbg); color:var(--ok); }
      .badge.fail { background:var(--badbg); color:var(--bad); }
      .badge.no-stage { background:#eef2f7; color:var(--muted); }
      .meta { color:var(--muted); font-size:0.85rem; margin-bottom:16px; }
      .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:18px; }
      .card h3 { margin:0 0 10px; font-size:0.95rem; color:#334155; }
      .miss-list { margin:0; padding-left:18px; }
      .miss-list li { color:var(--bad); font-size:0.88rem; margin-bottom:5px; }
      .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
      .tab { padding:7px 14px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:0.88rem; font-weight:600; }
      .tab.active { background:#0b1220; color:#fff; border-color:#0b1220; }
      .pane { display:none; }
      .pane.active { display:block; }
      .page-img { width:100%; border:1px solid var(--border); border-radius:8px; margin-bottom:14px; box-shadow:0 4px 16px rgba(2,6,23,0.06); }
      .shot { border:1px solid var(--border); border-radius:10px; margin-bottom:18px; overflow:hidden; background:#fff; }
      .shot-comment { padding:10px 12px; font-size:0.86rem; line-height:1.45; background:#fff7ed; border-bottom:1px solid var(--border); color:#7c2d12; }
      .shot-pair { display:grid; grid-template-columns:1fr 1fr; gap:0; }
      @media (max-width:900px) { .shot-pair { grid-template-columns:1fr; } }
      .shot-side { padding:10px; min-width:0; }
      .shot-side + .shot-side { border-left:1px solid var(--border); }
      .shot-label { font-size:0.72rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px; color:var(--muted); }
      .shot-label.prod { color:#b91c1c; }
      .shot-label.stage { color:#c2570a; }
      .shot-side img { width:100%; display:block; border:1px solid var(--border); border-radius:6px; }
      .shot-none { font-size:0.82rem; color:var(--muted); padding:18px 8px; text-align:center; border:1px dashed var(--border); border-radius:6px; }
      table.tbl { border-collapse:collapse; width:100%; margin-bottom:16px; font-size:0.85rem; }
      table.tbl td, table.tbl th { border:1px solid var(--border); padding:6px 9px; text-align:left; }
      table.tbl tr:first-child td { background:#f1f5f9; font-weight:700; }
      pre.text { white-space:pre-wrap; word-break:break-word; font-family:inherit; font-size:0.9rem; line-height:1.5; color:#1f2937; margin:0; }
      .spin { color:var(--muted); padding:30px; text-align:center; }
      .count-pill { display:inline-block; background:#eef2f7; color:#334155; border-radius:999px; padding:2px 10px; font-size:0.78rem; font-weight:700; margin-left:6px; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>BenQ Guide</h1>
        <div class="crumb">/content/guide/benq · content validation</div>
      </div>
      <select id="productSelect"><option value="">Select a PROD product…</option></select>
      <a href="/sites-validation" style="margin-left: 20px; color:#7dd3fc; text-decoration:none; font-weight:600;">🌐 Sites Validation</a>
      <a href="/">← Validation home</a>
    </header>

    <div class="wrap">
      <nav class="toc" id="toc"><div class="empty">Pick a product to load its table of contents.</div></nav>
      <main class="content" id="content">
        <div class="placeholder">Select a product, then click a TOC entry to view its content, images and tables.</div>
      </main>
    </div>

    <script>
      const productSelect = document.getElementById('productSelect');
      const tocEl = document.getElementById('toc');
      const contentEl = document.getElementById('content');
      let currentProduct = null;

      async function loadProducts() {
        try {
          const r = await fetch('/download/products');
          const products = (await r.json()).products || [];
          productSelect.innerHTML = '<option value="">Select a PROD product…</option>'
            + products.map(p => `<option value="${p.product}">${p.product}${p.zip_name ? '' : ' (no STAGE)'}</option>`).join('');
        } catch (e) {
          productSelect.innerHTML = '<option value="">Failed to load products</option>';
        }
      }

      async function loadToc(product) {
        currentProduct = product;
        tocEl.innerHTML = '<div class="spin">Loading TOC…</div>';
        contentEl.innerHTML = '<div class="placeholder">Click a TOC entry to view its content.</div>';
        try {
          const r = await fetch('/guide/toc/' + encodeURIComponent(product));
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || r.status);
          if (!d.toc.length) { tocEl.innerHTML = '<div class="empty">No TOC found in this PDF.</div>'; return; }
          tocEl.innerHTML = d.toc.map(t =>
            `<div class="toc-item" data-idx="${t.idx}" style="padding-left:${14 + (t.level-1)*14}px">
               <span class="dot"></span>
               <span class="t">${escapeHtml(t.title)}</span>
               <span class="pg">p.${t.page}</span>
             </div>`).join('');
          tocEl.querySelectorAll('.toc-item').forEach(el =>
            el.addEventListener('click', () => openSection(el)));
        } catch (e) {
          tocEl.innerHTML = '<div class="empty">Failed: ' + e.message + '</div>';
        }
      }

      async function openSection(el) {
        tocEl.querySelectorAll('.toc-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        const idx = el.getAttribute('data-idx');
        contentEl.innerHTML = '<div class="spin">Loading section…</div>';
        try {
          const r = await fetch('/guide/section/' + encodeURIComponent(currentProduct) + '/' + idx);
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || r.status);
          // reflect validation status on the TOC dot
          el.classList.remove('s-pass','s-fail');
          if (d.status === 'pass' || d.status === 'empty') el.classList.add('s-pass');
          else if (d.status === 'fail') el.classList.add('s-fail');
          renderSection(d);
        } catch (e) {
          contentEl.innerHTML = '<div class="placeholder">Failed: ' + e.message + '</div>';
        }
      }

      function renderSection(d) {
        const badge = d.status === 'pass' ? '<span class="badge pass">✓ Content present in STAGE</span>'
          : d.status === 'fail' ? '<span class="badge fail">✗ Content missing in STAGE</span>'
          : d.status === 'empty' ? '<span class="badge no-stage">Heading only — body under sub-sections</span>'
          : '<span class="badge no-stage">No STAGE to compare</span>';
        const cov = d.coverage != null ? `${Math.round(d.coverage)}% covered` : '';

        let missCard = '';
        if (d.missing && d.missing.length) {
          missCard = `<div class="card"><h3>Missing in STAGE (${d.missing.length})</h3>
            <ul class="miss-list">${d.missing.map(m => `<li>${escapeHtml(m)}</li>`).join('')}</ul></div>`;
        }

        const shotsHtml = (d.issue_shots || []).map(s => `
          <div class="shot">
            <div class="shot-comment"><b>Issue:</b> ${escapeHtml(s.comment)}</div>
            <div class="shot-pair">
              <div class="shot-side">
                <div class="shot-label prod">PROD &middot; page ${s.prod_page} &middot; missing content</div>
                <img src="${s.prod_img}" alt="PROD excerpt with the missing text highlighted" />
              </div>
              <div class="shot-side">
                <div class="shot-label stage">STAGE ${s.stage_page ? '&middot; page ' + s.stage_page : ''}</div>
                ${s.stage_img
                  ? `<img src="${s.stage_img}" alt="STAGE excerpt showing where the content should be" />`
                  : '<div class="shot-none">No matching location found in STAGE &mdash; the surrounding passage is absent too.</div>'}
              </div>
            </div>
          </div>`).join('') ||
          (d.status === 'fail'
            ? '<div class="placeholder">Issues found, but none could be located on a page.</div>'
            : '<div class="placeholder">No issues in this section.</div>');

        const tablesHtml = (d.tables || []).map(rows =>
          `<table class="tbl">${rows.map(row =>
            `<tr>${row.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</table>`).join('');

        contentEl.innerHTML = `
          <div class="sec-head"><h2>${escapeHtml(d.title)}</h2>${badge}</div>
          <div class="meta">Page ${d.page} · ${cov}
            · <span class="count-pill">${d.image_count} image(s)</span>
            · <span class="count-pill">${(d.tables||[]).length} table(s)</span></div>
          ${missCard}
          <div class="tabs">
            <div class="tab active" data-pane="rendered">Issues (${(d.issue_shots||[]).length})</div>
            <div class="tab" data-pane="tables">Tables (${(d.tables||[]).length})</div>
            <div class="tab" data-pane="text">Text</div>
          </div>
          <div class="pane active" data-pane="rendered">
            ${shotsHtml}
          </div>
          <div class="pane" data-pane="tables">${tablesHtml || '<div class="placeholder">No tables detected in this section.</div>'}</div>
          <div class="pane" data-pane="text"><div class="card"><pre class="text">${escapeHtml(d.text || '(no text)')}</pre></div></div>
        `;
        contentEl.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
          contentEl.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          contentEl.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
          tab.classList.add('active');
          contentEl.querySelector(`.pane[data-pane="${tab.getAttribute('data-pane')}"]`).classList.add('active');
        }));
      }

      function escapeHtml(s) {
        return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      productSelect.addEventListener('change', () => {
        if (productSelect.value) loadToc(productSelect.value);
      });
      loadProducts();
    </script>
  </body>
</html>
